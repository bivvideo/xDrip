name: Build iCan companion test APK

on:
  push:
    branches:
      - fix-ican-companion-notification

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch iCan notification parser
        run: python3 tools/ican_notification_patch.py

      - name: Give test APK a separate package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          s = gradle.read_text()
          old = '//      applicationIdSuffix ".debug"'
          new = '      applicationIdSuffix ".icantest"'
          if old not in s:
              raise SystemExit('Expected applicationIdSuffix marker not found')
          gradle.write_text(s.replace(old, new, 1))

          gs = Path('app/google-services.json')
          j = gs.read_text()
          old_pkg = 'com.eveningoutpost.dexdrip'
          new_pkg = 'com.eveningoutpost.dexdrip.icantest'
          if old_pkg not in j:
              raise SystemExit('Expected package name not found in google-services.json')
          gs.write_text(j.replace(old_pkg, new_pkg))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew assembleProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xDrip-iCan-test-apk
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
